<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <button id="darkToggle">🌙</button>
    <p>Enter your text or URL</p>
    <input type="text" placeholder="Enter text or URL" id="qrText">

    <div id="img-box">
        <img src="" id="qrImage">
    </div>

    <button onclick="generateQRCode()">Generate QR Code</button>
    <button id="downloadBtn">Download QR Code</button>
    <button id="copyBtn">Copy QR Code</button>
</div>

<script>
    const imgBox = document.getElementById('img-box');
    const qrImage = document.getElementById('qrImage');
    const qrText = document.getElementById('qrText');
    const downloadBtn = document.getElementById('downloadBtn');
    const copyBtn = document.getElementById('copyBtn');
    const darkToggle = document.getElementById('darkToggle');

    function generateQRCode() {
        if (qrText.value.length > 0) {
            const data = encodeURIComponent(qrText.value);
            qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${data}`;
            imgBox.classList.add('show-img');
        } else {
            qrText.classList.add('error');
            setTimeout(() => qrText.classList.remove('error'), 500);
        }
    }

    downloadBtn.addEventListener('click', async () => {
        if (qrImage.src && qrImage.src.includes('api.qrserver.com')) {
            try {
                const response = await fetch(qrImage.src);
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'qr-code.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            } catch (error) {
                alert('Failed to download QR Code.');
            }
        } else {
            alert('Please generate a QR Code first.');
        }
    });

    copyBtn.addEventListener('click', async () => {
        if (qrImage.src && qrImage.src.includes('api.qrserver.com')) {
            try {
                const response = await fetch(qrImage.src);
                const blob = await response.blob();
                await navigator.clipboard.write([
                    new ClipboardItem({ [blob.type]: blob })
                ]);
                alert('QR Code copied to clipboard!');
            } catch (err) {
                alert('Failed to copy QR Code.');
            }
        } else {
            alert('Please generate a QR Code first.');
        }
    });

    darkToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        darkToggle.innerHTML = document.body.classList.contains('dark') ? '☀️' : '🌙';
    });
</script>

</body>
</html>
